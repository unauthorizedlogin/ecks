name: 👤 Character Biography
description: Help us build your in-game character and dialogue profile.
title: "👤 [Character]: "
labels:
  - character
  - biography
  - needs-triage

body:

  - type: markdown
    attributes:
      value: |
        # 👋 Welcome!

        This form helps us build your in-game character, dialogue, personality, and behavior.

        There are no right or wrong answers.

        ⭐ Core Character Foundation creates your character foundation.
        🎭 Personality & Voice builds personality, voice, and behavior.
        📖 Legend & Lore adds deeper lore and customization.

        - The more detail you provide, the more authentic your character will become.
        - You do not need to complete everything at once.
        - After submitting, your character profile can be reviewed and expanded.
        - If you think of additional details later, leave a comment on your submission and we'll incorporate them.

# =========================================================
# ⭐ CORE CHARACTER FOUNDATION
# =========================================================

  - type: markdown
    attributes:
      value: |
        # ⭐ Core Character Foundation

        This section gives us everything needed to create your character.

  - type: input
    id: clan_name
    attributes:
      label: Clan Name
      description: What should your character be called?
      placeholder: Red
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Character Title
      description: Optional nickname or title.
      placeholder: The Realm Weaver

  - type: textarea
    id: summary
    attributes:
      label: Character Summary
      description: Give us the quick version. If someone met this character for the first time, how would you describe them?
      placeholder: |
        Example:
        A stubborn blacksmith who acts tough but secretly cares deeply about everyone around them.
        A retired mercenary with a sarcastic attitude and a soft spot for protecting children.

  - type: dropdown
    id: alignment
    attributes:
      label: Moral Alignment
      options:
        - Lawful Good
        - Neutral Good
        - Chaotic Good
        - Lawful Neutral
        - True Neutral
        - Chaotic Neutral
        - Lawful Evil
        - Neutral Evil
        - Chaotic Evil

  - type: checkboxes
    id: traits
    attributes:
      label: Personality Traits
      options:
        - label: Calm
        - label: Aggressive
        - label: Patient
        - label: Curious
        - label: Intelligent
        - label: Loyal
        - label: Protective
        - label: Competitive
        - label: Honest
        - label: Manipulative
        - label: Brave
        - label: Cowardly
        - label: Emotional
        - label: Logical
        - label: Optimistic
        - label: Pessimistic
        - label: Introverted
        - label: Extroverted

  - type: checkboxes
    id: motivations
    attributes:
      label: Dreams & Goals
      description: What drives this character forward? Choose the things that matter most to them.
      options:
        - label: Protecting others
        - label: Seeking power
        - label: Finding purpose
        - label: Gaining knowledge
        - label: Achieving freedom
        - label: Seeking revenge
        - label: Proving themselves
        - label: Building a legacy
        - label: Wealth and prosperity
        - label: Adventure and discovery
        - label: Loyalty to others
        - label: Redemption
        - label: Justice
        - label: Recognition
        - label: Survival

  - type: checkboxes
    id: strengths
    attributes:
      label: Greatest Strengths
      description: What abilities, talents, or qualities give this character an advantage?
      options:
        - label: Natural Leader
        - label: Skilled Fighter
        - label: Master Strategist
        - label: Quick Learner
        - label: Problem Solver
        - label: Strong Willpower
        - label: Unbreakable Determination
        - label: Excellent Communication
        - label: Inspires Others
        - label: Creative Thinker
        - label: Highly Adaptable
        - label: Exceptional Memory
        - label: Deep Knowledge
        - label: Resourceful Under Pressure
        - label: Excellent Judgment
        - label: Strong Sense of Justice
        - label: Emotionally Resilient
        - label: Patient Teacher
        - label: Skilled Craftsman
        - label: Natural Survivor

  - type: checkboxes
    id: weaknesses
    attributes:
      label: Greatest Weaknesses
      description: What flaws, habits, or struggles create problems for this character?
      options:
        - label: Stubborn - refuses to change their mind even when wrong
        - label: Reckless - acts before thinking about consequences
        - label: Prideful - struggles to admit mistakes or accept help
        - label: Impulsive - makes decisions based on emotion
        - label: Distrustful - has trouble believing others' intentions
        - label: Short-tempered - reacts strongly when frustrated
        - label: Selfish - prioritizes personal wants over others
        - label: Overconfident - underestimates challenges
        - label: Naive - believes things too easily
        - label: Overprotective - tries to control situations to keep others safe
        - label: Secretive - hides important thoughts or feelings
        - label: Too Forgiving - gives others too many chances
        - label: Unable to Let Go - remains attached to past failures or losses
        - label: Fear of Failure - avoids risks to prevent mistakes
        - label: Fear of Rejection - struggles to open up to others
        - label: Perfectionist - expects impossible standards from themselves
        - label: Self-Doubt - questions their own abilities
        - label: Easily Distracted - struggles to stay focused
        - label: Holds Grudges - struggles to forgive
        - label: Takes Too Much Responsibility - tries to solve everything alone

  - type: checkboxes
    id: fears
    attributes:
      label: Greatest Fears
      description: What fears influence this character's choices?
      options:
        - label: Losing someone they love
        - label: Failure
        - label: Being forgotten
        - label: Betrayal
        - label: Losing control
        - label: Being powerless
        - label: Becoming like their enemies
        - label: Being alone
        - label: Revealing their true self
        - label: Repeating past mistakes
        - label: Death
        - label: Disappointing others

# =========================================================
# 🎭 PERSONALITY & VOICE
# =========================================================

  - type: markdown
    attributes:
      value: |
        # 🎭 Personality & Voice

        This section adds depth to your character's dialogue, reactions, and everyday behavior.

        ⭐ Everything here is optional.
        
        The more you provide, the more unique and accurate your character will become.

        You can complete as much or as little as you want. Even a few details help us create a stronger personality.

  - type: textarea
    id: personality
    attributes:
      label: Personality
      description: What makes this character who they are? Describe their attitudes, behaviors, beliefs, and the way they interact with others.
      placeholder: |
        Example:
        He avoids talking about his past and uses humor to hide discomfort.
        She trusts actions more than words and respects people who keep their promises.
        Things You Like
        Things You Dislike

  - type: checkboxes
    id: quirks
    attributes:
      label: Character Quirks
      description: Choose the little things that make this character unique.
      options:
        - label: Always gets lost
        - label: Talks to themselves
        - label: Gives everything a nickname
        - label: Collects strange objects
        - label: Cannot resist a challenge
        - label: Always hungry
        - label: Falls asleep anywhere
        - label: Has terrible luck
        - label: Overthinks everything
        - label: Takes everything literally
        - label: Makes inappropriate jokes at the worst time
        - label: Pretends not to care but secretly does
        - label: Has a weird superstition
        - label: Keeps a personal ritual
        - label: Always breaks something by accident
        - label: Talks too much when nervous
        - label: Gets embarrassed easily
        - label: Cannot admit when they are wrong
        - label: Names their equipment
        - label: Has an unusual hobby

  - type: textarea
    id: unique_quirk
    attributes:
      label: The One Thing Nobody Else Does
      description: What is the strange, funny, or unexpected thing that makes this character unforgettable?
      placeholder: |
        Example:
        "Despite being a legendary warrior, he is absolutely terrified of frogs."
        "Despite being known as the coldest assassin in the kingdom, she secretly rescues every stray animal she finds and gives them ridiculous names."

  - type: textarea
    id: contradiction
    attributes:
      label: Character Contradiction
      description: What makes this character unexpectedly different from how they appear?
      placeholder: |
        Examples:
        - Looks intimidating but is extremely kind.
        - Acts lazy but secretly trains constantly.
        - Claims not to care but always helps others.
        - Is a genius but terrible at common sense.

  - type: textarea
    id: hobbies
    attributes:
      label: Hobbies & Interests
      description: Optional. What does this character enjoy doing when they aren't fighting, working, or chasing their goals? What small activities reveal who they really are?
      placeholder: |
        Example:
        "Despite his intimidating reputation, he spends his free time carving wooden figures and leaving them anonymously for children in the village."
        "Despite being known as a ruthless bounty hunter, she spends her evenings tending a small garden and secretly writes letters of encouragement to people she has helped."

        Think about:
        - What do they do to relax?
        - What topics can they talk about for hours?
        - What skill do they practice outside of necessity?
        - What would someone find them doing during a quiet moment?

  - type: checkboxes
    id: humor
    attributes:
      label: Humor Style
      options:
        - label: Sarcastic
        - label: Dry Humor
        - label: Dad Jokes
        - label: Dark Humor
        - label: Wholesome
        - label: Deadpan
        - label: Chaotic
        - label: Rarely Jokes

  - type: textarea
    id: speech
    attributes:
      label: Speech Style
      description: How do you normally speak?

  - type: textarea
    id: dialogue_examples
    attributes:
      label: Dialogue Examples
      description: Write 5-10 words or phrases your character might naturally say.

  - type: textarea
    id: never_say
    attributes:
      label: Things You Would Never Say

  - type: textarea
    id: reactions
    attributes:
      label: How Do You React?
      description: |
        Tell us how you react when...

        • Someone insults you
        • Someone compliments you
        • Someone needs help
        • Someone betrays you
        • Someone lies to you
        • You lose
        • You win

# =========================================================
# 📖 LEGEND & LORE
# =========================================================

  - type: markdown
    attributes:
      value: |
        # 📖 Legend & Lore

        This section is for deeper character development and storytelling.

        ⭐ Everything here is optional.

        Use this section if you want to explore your character's history, defining moments, secrets, and personal journey.

        A simple character concept is enough to get started. 
        
        The details you provide here simply help us create a richer story, stronger dialogue, and more meaningful interactions.


  - type: textarea
    id: backstory
    attributes:
      label: Character Backstory
      description: Before becoming who they are today, this character lived a different life. Tell us about the experiences, struggles, victories, and turning points that shaped them.
      placeholder: |
        Example:
        Once a gifted warrior, he abandoned his homeland after failing to protect his family.
        Years of wandering taught her patience, compassion, and the importance of helping others.
        
  - type: textarea
    id: turning_point
    attributes:
      label: The Turning Point
      description: What single moment changed this character forever?
      placeholder: |
        The battle they lost.
        The person they failed.
        The discovery they made.
        The promise they swore.

  - type: textarea
    id: tragedy
    attributes:
      label: Greatest Tragedy
      description: What is the hardest moment this character has faced? How did it change them, and what scars did they carry forward?
      placeholder: |
        A loss they never recovered from.
        A mistake they still regret.
        Someone they failed to protect.
        A choice that changed everything.

  - type: textarea
    id: achievement
    attributes:
      label: Greatest Achievement
      description: What is the moment this character is most proud of? What did they overcome, and why does this accomplishment matter to them?
      placeholder: |
        A battle they survived.
        A person they saved.
        Something they built.
        A challenge nobody thought they could overcome.

  - type: textarea
    id: secrets
    attributes:
      label: Secrets
      description: Optional. Things your character keeps hidden.
      placeholder: |
        Example:
        "The famous hero everyone admires was actually saved by the enemy he now hunts."
        "She pretends to hate magic, but secretly practices forbidden spells in private."

  - type: textarea
    id: defining_trait
    attributes:
      label: What Makes This Character Unique?
      description: Explain anything the selections above don't capture.
      placeholder: |
        Example:
        "He is afraid of failure, but that fear is exactly what makes him prepare harder than anyone else."
        "She isn't seeking redemption because she feels guilty. She's seeking it because she wants to prove the person she became isn't who she truly is."

  - type: textarea
    id: final_notes
    attributes:
      label: Anything Else?
      description: Tell us anything that helps bring your character to life.
